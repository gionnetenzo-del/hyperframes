            pointer-events: none; }
      #rule1-ou { left: 455px; width: 170px; height: 170px; border-radius: 50%; background: var(--gold); line-height: 180px; top: 195px; }

  </style>
  <div id="root" data-composition-id="rule1" data-start="0" data-duration="8.85" data-width="1080" data-height="1920">
    <div id="rule1-cam" class="cam">
      <div id="rule1-three" class="row disp" style="top:330px">

      <div id="rule1-finger" class="abs" style="left:600px;top:700px">
        <svg viewBox="0 0 120 160" width="170" height="226"><path d="M40 70 V20 a14 14 0 0 1 28 0 V62 l30 6 a14 14 0 0 1 12 16 l-8 50 a20 20 0 0 1 -20 18 H48 a20 20 0 0 1 -16 -8 L8 110 a12 12 0 0 1 18 -16 l14 14z" fill="#f0c19c" stroke="#0a1f18" stroke-width="6" stroke-linejoin="round"/></svg>
      </div>
      <div id="rule1-role" class="row disp sub" style="top:340px">TON RÔLE ?</div>
      <div id="rule1-cards" class="abs" style="left:0;top:560px;width:1080px;height:600px">
        <div id="rule1-cj" class="card rolecard" style="left:70px"><svg viewBox="0 0 200 200" width="230" height="230"><path d="M60 30 L20 60 L40 100 L58 90 L58 180 L142 180 L142 90 L160 100 L180 60 L140 30 Q100 54 60 30z" fill="#0f4431" stroke="#0a1f18" stroke-width="6" stroke-linejoin="round"/><rect x="58" y="96" width="84" height="18" fill="#ffcf1f"/><rect x="58" y="134" width="84" height="18" fill="#ffcf1f"/><text x="100" y="86" font-family="League Gothic" font-size="44" text-anchor="middle" fill="#ffcf1f">10</text></svg><div class="disp rolename">JOUEUR</div></div>
        <div id="rule1-cb" class="card rolecard" style="left:570px"><svg viewBox="0 0 200 200" width="230" height="230"><rect x="56" y="40" width="100" height="140" rx="12" fill="#c9a26b" stroke="#0a1f18" stroke-width="6"/><rect x="86" y="28" width="40" height="24" rx="6" fill="#888" stroke="#0a1f18" stroke-width="5"/><rect x="74" y="66" width="64" height="104" rx="4" fill="#f7f4ea"/><path d="M84 88 h44 M84 108 h44 M84 128 h30" stroke="#0a1f18" stroke-width="6" stroke-linecap="round"/><path d="M86 150 l10 10 l20 -22" stroke="#0f8a4a" stroke-width="7" fill="none" stroke-linecap="round"/><circle cx="160" cy="160" r="22" fill="#ffcf1f" stroke="#0a1f18" stroke-width="5"/><path d="M150 152 h20" stroke="#0a1f18" stroke-width="5"/></svg><div class="disp rolename">BÉNÉVOLE</div></div>

  </div>
  <script>
    (() => {
      const tl = gsap.timeline({ paused: true });

      // --- Max rig helpers (all on this scene's paused timeline) ---
      const rig = (p) => ({
        body: "#" + p + "-body", head: "#" + p + "-head", armL: "#" + p + "-armL", armR: "#" + p + "-armR",
        eyes: ["#" + p + "-eyeL", "#" + p + "-eyeR"], mOpen: "#" + p + "-mOpen", mO: "#" + p + "-mO",
        brows: ["#" + p + "-browL", "#" + p + "-browR"], ball: "#" + p + "-ball",
      });
      const blink = (r, t) => {
        tl.to(r.eyes, { scaleY: 0.1, transformOrigin: "50% 50%", duration: 0.05, ease: "power1.in" }, t);
        tl.to(r.eyes, { scaleY: 1, transformOrigin: "50% 50%", duration: 0.08, ease: "power1.out" }, t + 0.06);
      };
      const talk = (r, starts) => {
        starts.forEach((s) => {
          tl.set(r.mOpen, { opacity: 1 }, s);
          tl.set(r.mOpen, { opacity: 0 }, s + 0.13);
        });
      };
      const arm = (sel, side, rot, t, d = 0.35, ease = "back.out(1.6)") => {
        const o = side === "L" ? "92 200" : "208 200";
        tl.to(sel, { rotation: rot, svgOrigin: o, duration: d, ease }, t);
      };
      const hop = (r, t, lift = 60) => {
        // anticipation squash, jump, land squash, settle
        tl.to(r.body, { scaleY: 0.9, scaleX: 1.06, svgOrigin: "150 500", duration: 0.12, ease: "power2.in" }, t);
        tl.to(r.body, { scaleY: 1.06, scaleX: 0.96, y: -lift, svgOrigin: "150 500", duration: 0.22, ease: "power2.out" }, t + 0.12);
        tl.to(r.body, { scaleY: 0.92, scaleX: 1.05, y: 0, svgOrigin: "150 500", duration: 0.18, ease: "power2.in" }, t + 0.34);
        tl.to(r.body, { scaleY: 1, scaleX: 1, svgOrigin: "150 500", duration: 0.3, ease: "elastic.out(1, 0.5)" }, t + 0.52);
      };
      const breathe = (r, t0, t1) => {
        for (let t = t0; t < t1 - 1.2; t += 1.6) {
          tl.to(r.body, { scaleY: 1.012, svgOrigin: "150 500", duration: 0.8, ease: "sine.inOut" }, t);
          tl.to(r.body, { scaleY: 1, svgOrigin: "150 500", duration: 0.8, ease: "sine.inOut" }, t + 0.8);
        }
      };


      gsap.set("#rule1-head, #rule1-sub, #rule1-btnwrap, #rule1-finger, #rule1-role, #rule1-cards, #rule1-btn-b", { opacity: 0 });
      // entry: settles from slightly large (after the zoom-through)
      tl.fromTo("#rule1-cam", { scale: 1.25, filter: "blur(14px)", opacity: 0 }, { scale: 1, filter: "blur(0px)", opacity: 1, duration: 0.4, ease: "expo.out" }, 0);
      tl.fromTo("#rule1-3a", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18 }, 0.1);
      tl.fromTo("#rule1-3b", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18 }, 0.79);
      tl.fromTo(["#rule1-d0", "#rule1-d1", "#rule1-d2"], { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, stagger: 0.1, ease: "back.out(2)" }, 1.0);
      // "1" becomes the rule chip
      tl.to(["#rule1-3a", "#rule1-3b", "#rule1-d1", "#rule1-d2"], { opacity: 0, filter: "blur(8px)", duration: 0.16 }, 1.8);
      tl.to("#rule1-d0", { scale: 0.4, y: -560, x: 0, opacity: 0, duration: 0.3, ease: "power3.in" }, 1.8);
      tl.set("#rule1-head", { opacity: 1 }, 2.0);
      tl.fromTo("#rule1-head .chip", { scale: 0.4 }, { scale: 1, duration: 0.3, ease: "back.out(2)" }, 2.0);
      tl.set("#rule1-sub", { opacity: 1 }, 2.95);
      tl.fromTo("#rule1-sub", { filter: "blur(8px)" }, { filter: "blur(0px)", duration: 0.16 }, 2.95);
      tl.set("#rule1-btnwrap", { opacity: 1 }, 2.4);
      tl.fromTo("#rule1-btn", { scale: 0.3, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(1.6)" }, 2.4);
      // finger enters from off-screen bottom right, taps on "t'abonnes"
      tl.set("#rule1-finger", { opacity: 1 }, 2.6);
      tl.fromTo("#rule1-finger", { x: 500, y: 900, rotation: -20 }, { x: 0, y: 0, rotation: 0, duration: 0.55, ease: "power3.out" }, 2.6);
      tl.to("#rule1-finger", { scale: 0.86, duration: 0.07, ease: "power2.in" }, 3.22);
      tl.to("#rule1-finger", { scale: 1, duration: 0.15, ease: "power2.out" }, 3.29);
      tl.to("#rule1-btn", { scale: 0.93, duration: 0.07 }, 3.22);
      tl.to("#rule1-btn", { scale: 1, backgroundColor: "#0f8a4a", boxShadow: "0 16px 0 #075a2f", duration: 0.3, ease: "back.out(2)" }, 3.29);
      tl.set("#rule1-btn-a", { opacity: 0 }, 3.29);
      tl.set("#rule1-btn-b", { opacity: 1 }, 3.29);
      tl.to("#rule1-finger", { x: 600, y: 900, duration: 0.4, ease: "power3.in" }, 4.0);
      // choose your role: button splits into two cards
      tl.to("#rule1-sub", { opacity: 0, filter: "blur(8px)", duration: 0.16 }, 5.4);
      tl.set("#rule1-role", { opacity: 1 }, 5.6);
      tl.fromTo("#rule1-role", { filter: "blur(8px)" }, { filter: "blur(0px)", duration: 0.16 }, 5.6);
      tl.to("#rule1-btn", { scaleX: 0.2, opacity: 0, duration: 0.22, ease: "power3.in" }, 5.6);
      tl.set("#rule1-cards", { opacity: 1 }, 5.75);
      tl.fromTo("#rule1-cj", { x: 250, scale: 0.5, rotation: 0 }, { x: 0, scale: 1, rotation: -3, duration: 0.5, ease: "back.out(1.4)" }, 5.75);
      tl.fromTo("#rule1-cb", { x: -250, scale: 0.5, rotation: 0 }, { x: 0, scale: 1, rotation: 3, duration: 0.5, ease: "back.out(1.4)" }, 5.82);
      tl.fromTo("#rule1-ou", { scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(2)" }, 7.3);
      // highlight on each word
      tl.to("#rule1-cj", { scale: 1.08, rotation: -5, boxShadow: "0 0 0 14px #ffcf1f, 0 18px 0 rgba(0,0,0,0.25)", duration: 0.25, ease: "back.out(2)" }, 6.7);
      tl.to("#rule1-cj", { scale: 1, rotation: -3, boxShadow: "0 0 0 0px #ffcf1f, 0 18px 0 rgba(0,0,0,0.25)", duration: 0.25 }, 8.0);
      tl.to("#rule1-cb", { scale: 1.08, rotation: 5, boxShadow: "0 0 0 14px #ffcf1f, 0 18px 0 rgba(0,0,0,0.25)", duration: 0.25, ease: "back.out(2)" }, 8.2);
      // exit: whip left
      tl.to("#rule1-cam", { x: -1100, filter: "blur(18px)", duration: 0.3, ease: "power3.in" }, 8.549999999999999);

      window.__timelines = window.__timelines || {};
      window.__timelines["rule1"] = tl;
    })();
  </script>
