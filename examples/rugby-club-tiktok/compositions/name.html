             line-height: 120px; padding-left: 50px; }
      .ph { color: #8b8f8c; }
      .typed { position: absolute; left: 50px; top: 0; font-weight: 900; }
      .caret { display: inline-block; width: 5px; height: 56px; background: var(--ink); vertical-align: middle; margin-left: 6px; }
      .propose { margin-top: 24px; font-size: 76px; text-align: center; white-space: nowrap; }

      <path d="M100 470 h44 q8 0 8 10 v10 h-58 q-4-20 6-20z" fill="#111"/>
      <path d="M156 470 h44 q10 0 6 20 h-58 v-10 q0-10 8-10z" fill="#111"/>

          <path d="M126 134 Q150 134 174 134 Q172 166 150 168 Q128 166 126 134z" fill="#5a1414" stroke="#0a1f18" stroke-width="4"/>
          <ellipse cx="150" cy="158" rx="12" ry="6" fill="#e05a6a"/>
        </g>
        <g id="nm-mO" opacity="0">

    </div>
  </div>
  <script>
    (() => {
      const tl = gsap.timeline({ paused: true });

      // --- Max rig helpers (all on this scene's paused timeline) ---
      const rig = (p) => ({
        body: "#" + p + "-body", head: "#" + p + "-head", armL: "#" + p + "-armL", armR: "#" + p + "-armR",
        eyes: ["#" + p + "-eyeL", "#" + p + "-eyeR"], mOpen: "#" + p + "-mOpen", mO: "#" + p + "-mO",
        brows: ["#" + p + "-browL", "#" + p + "-browR"], ball: "#" + p + "-ball",
      });
      const blink = (r, t) => {
        tl.to(r.eyes, { scaleY: 0.1, transformOrigin: "50% 50%", duration: 0.05, ease: "power1.in" }, t);
        tl.to(r.eyes, { scaleY: 1, transformOrigin: "50% 50%", duration: 0.08, ease: "power1.out" }, t + 0.06);
      };
      const talk = (r, starts) => {
        starts.forEach((s) => {
          tl.set(r.mOpen, { opacity: 1 }, s);
          tl.set(r.mOpen, { opacity: 0 }, s + 0.13);
        });
      };
      const arm = (sel, side, rot, t, d = 0.35, ease = "back.out(1.6)") => {
        const o = side === "L" ? "92 200" : "208 200";
        tl.to(sel, { rotation: rot, svgOrigin: o, duration: d, ease }, t);
      };
      const hop = (r, t, lift = 60) => {
        // anticipation squash, jump, land squash, settle
        tl.to(r.body, { scaleY: 0.9, scaleX: 1.06, svgOrigin: "150 500", duration: 0.12, ease: "power2.in" }, t);
        tl.to(r.body, { scaleY: 1.06, scaleX: 0.96, y: -lift, svgOrigin: "150 500", duration: 0.22, ease: "power2.out" }, t + 0.12);
        tl.to(r.body, { scaleY: 0.92, scaleX: 1.05, y: 0, svgOrigin: "150 500", duration: 0.18, ease: "power2.in" }, t + 0.34);
        tl.to(r.body, { scaleY: 1, scaleX: 1, svgOrigin: "150 500", duration: 0.3, ease: "elastic.out(1, 0.5)" }, t + 0.52);
      };
      const breathe = (r, t0, t1) => {
        for (let t = t0; t < t1 - 1.2; t += 1.6) {
          tl.to(r.body, { scaleY: 1.012, svgOrigin: "150 500", duration: 0.8, ease: "sine.inOut" }, t);
          tl.to(r.body, { scaleY: 1, svgOrigin: "150 500", duration: 0.8, ease: "sine.inOut" }, t + 0.8);
        }
      };


      const r = rig("nm");
      gsap.set("#name-crest, #name-ep, #name-input, #name-maxwrap", { opacity: 0 });
      // entry: the lights go down
      tl.to("#name-dark", { opacity: 0.82, duration: 0.5, ease: "power2.inOut" }, 0);
      tl.fromTo("#name-t .sub", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, stagger: 0.0 }, 0.17);
      gsap.set("#name-t .gold", { opacity: 0 });
      tl.fromTo("#name-t .gold", { opacity: 0, scale: 1.3, filter: "blur(10px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.25, ease: "expo.out" }, 2.46);
      // crest rises into the spotlight
      tl.set("#name-crest", { opacity: 1 }, 0.8);
      tl.fromTo("#name-crest", { y: 300, scale: 0.6, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: 0.7, ease: "expo.out" }, 0.8);
      tl.to("#name-spot", { opacity: 1, duration: 0.6 }, 0.8);
      // slot machine on the banner: rolls then lands on "? ? ?"
      const step = 130;
      gsap.set("#name-roll", { y: 0 });
      for (let k = 1; k <= 5; k++) {
        tl.to("#name-roll", { y: -k * step, duration: 0.1 + k * 0.03, ease: k === 5 ? "back.out(2)" : "power1.inOut" }, 2.65 + (k - 1) * 0.16 + (k * (k - 1)) * 0.015);
      }
      // Max peeks in, hand on chin
      tl.set("#name-maxwrap", { opacity: 1 }, 0.1);
      tl.fromTo("#name-maxwrap", { x: -300 }, { x: 0, duration: 0.5, ease: "power3.out" }, 0.1);
      arm(r.armR, "R", -150, 0.5, 0.4, "power2.inOut");
      tl.to(r.head, { rotation: 10, svgOrigin: "150 170", duration: 0.4 }, 0.5);
      tl.to(r.eyes, { x: 6, y: -5, duration: 0.3 }, 0.5);
      talk(r, [0.17, 0.35, 0.42, 0.84, 1.38, 1.44, 1.68, 2.46, 2.6, 2.81, 2.95]);
      blink(r, 1.9);
      // EPISODE 2 stamp on "annoncé"
      tl.set("#name-ep", { opacity: 1 }, 3.9);
      tl.fromTo("#name-ep-pill", { scale: 2.4, rotation: -12, opacity: 0 }, { scale: 1, rotation: -4, opacity: 1, duration: 0.24, ease: "power4.in" }, 3.9);
      tl.fromTo("#name-crest", { x: 0 }, { x: 0, keyframes: [{ x: -10, duration: 0.04 }, { x: 9, duration: 0.04 }, { x: -5, duration: 0.04 }, { x: 0, duration: 0.04 }] }, 4.14);
      // "propose le tien": comment box types a suggestion
      tl.to("#name-ep", { opacity: 0, y: -40, filter: "blur(8px)", duration: 0.2 }, 5.9);
      tl.to("#name-maxwrap", { x: -320, duration: 0.35, ease: "power3.in" }, 5.8);
      tl.to("#name-crest", { scale: 0.72, y: -90, duration: 0.45, ease: "power3.inOut" }, 5.95);
      tl.set("#name-input", { opacity: 1 }, 6.1);
      tl.fromTo("#name-input", { y: 120, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "expo.out" }, 6.1);
      const typed = "Moi je propose : " + "…";
      gsap.set("#name-typed", { textContent: "" });
      for (let i = 1; i <= typed.length; i++) {
        tl.set("#name-typed", { textContent: typed.slice(0, i) }, 6.9 + i * 0.055);
      }
      tl.set(".ph", { opacity: 0 }, 6.95);
      gsap.set(".ph", { opacity: 1 });
      gsap.set("#name-caret", { opacity: 0 });
      // exit: zoom through the crest
      tl.to("#name-cam", { scale: 3, transformOrigin: "50% 45%", opacity: 0, filter: "blur(16px)", duration: 0.32, ease: "power3.in" }, 8.68);
      tl.to("#name-dark", { opacity: 0, duration: 0.3 }, 8.7);

      window.__timelines = window.__timelines || {};
      window.__timelines["name"] = tl;
    })();
  </script>
</template>
