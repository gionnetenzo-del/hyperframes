  <script>
    (() => {
      const tl = gsap.timeline({ paused: true });

      // --- Max rig helpers (all on this scene's paused timeline) ---
      const rig = (p) => ({
        body: "#" + p + "-body", head: "#" + p + "-head", armL: "#" + p + "-armL", armR: "#" + p + "-armR",
        eyes: ["#" + p + "-eyeL", "#" + p + "-eyeR"], mOpen: "#" + p + "-mOpen", mO: "#" + p + "-mO",
        brows: ["#" + p + "-browL", "#" + p + "-browR"], ball: "#" + p + "-ball",
      });
      const blink = (r, t) => {
        tl.to(r.eyes, { scaleY: 0.1, transformOrigin: "50% 50%", duration: 0.05, ease: "power1.in" }, t);
        tl.to(r.eyes, { scaleY: 1, transformOrigin: "50% 50%", duration: 0.08, ease: "power1.out" }, t + 0.06);
      };
      const talk = (r, starts) => {
        starts.forEach((s) => {
          tl.set(r.mOpen, { opacity: 1 }, s);
          tl.set(r.mOpen, { opacity: 0 }, s + 0.13);
        });
      };
      const arm = (sel, side, rot, t, d = 0.35, ease = "back.out(1.6)") => {
        const o = side === "L" ? "92 200" : "208 200";
        tl.to(sel, { rotation: rot, svgOrigin: o, duration: d, ease }, t);
      };
      const hop = (r, t, lift = 60) => {
        // anticipation squash, jump, land squash, settle
        tl.to(r.body, { scaleY: 0.9, scaleX: 1.06, svgOrigin: "150 500", duration: 0.12, ease: "power2.in" }, t);
        tl.to(r.body, { scaleY: 1.06, scaleX: 0.96, y: -lift, svgOrigin: "150 500", duration: 0.22, ease: "power2.out" }, t + 0.12);
        tl.to(r.body, { scaleY: 0.92, scaleX: 1.05, y: 0, svgOrigin: "150 500", duration: 0.18, ease: "power2.in" }, t + 0.34);
        tl.to(r.body, { scaleY: 1, scaleX: 1, svgOrigin: "150 500", duration: 0.3, ease: "elastic.out(1, 0.5)" }, t + 0.52);
      };
      const breathe = (r, t0, t1) => {
        for (let t = t0; t < t1 - 1.2; t += 1.6) {
          tl.to(r.body, { scaleY: 1.012, svgOrigin: "150 500", duration: 0.8, ease: "sine.inOut" }, t);
          tl.to(r.body, { scaleY: 1, svgOrigin: "150 500", duration: 0.8, ease: "sine.inOut" }, t + 0.8);
        }
      };


      const r = rig("mm");
      gsap.set("#max-dream, #max-launch, #max-alone, #max-need", { opacity: 0 });
      // entry: arrives from below, matching the whip up
      tl.fromTo("#max-cam", { y: 500, filter: "blur(18px)" }, { y: 0, filter: "blur(0px)", duration: 0.35, ease: "power3.out" }, 0);
      // name per letter
      tl.fromTo(".ml", { opacity: 0.3, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.12, stagger: 0.1 }, 0.4);
      gsap.set(".ml", { opacity: 0 });
      tl.fromTo("#max-role", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.7)" }, 0.7);
      // wave hello
      arm(r.armR, "R", -150, 0.1, 0.3);
      tl.to(r.armR, { rotation: -125, svgOrigin: "208 200", duration: 0.16, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0.42);
      arm(r.armR, "R", -8, 1.2, 0.3, "power2.inOut");
      // dream: name moves up & out, bubble rises
      tl.to("#max-name", { opacity: 0, filter: "blur(8px)", duration: 0.2 }, 1.5);
      tl.set("#max-dream", { opacity: 1 }, 1.6);
      tl.fromTo("#max-bub3", { scale: 0 }, { scale: 1, duration: 0.25, ease: "back.out(2)" }, 1.6);
      tl.fromTo("#max-bub2", { scale: 0 }, { scale: 1, duration: 0.25, ease: "back.out(2)" }, 1.75);
      tl.fromTo("#max-bub1", { scale: 0, transformOrigin: "10% 100%" }, { scale: 1, duration: 0.45, ease: "back.out(1.5)" }, 1.9);
      tl.to("#max-maxwrap", { x: -110, duration: 0.6, ease: "power2.inOut" }, 1.6);
      tl.to(r.head, { rotation: 12, svgOrigin: "150 170", duration: 0.5, ease: "power2.inOut" }, 1.7);
      tl.to(r.eyes, { x: 6, y: -6, duration: 0.3 }, 1.7);
      arm(r.armL, "L", -20, 1.8, 0.4, "power2.inOut");
      // bubble pops on "Aujourd'hui"
      tl.to("#max-bub1, #max-bub2, #max-bub3", { scale: 1.15, opacity: 0, duration: 0.14, ease: "power2.in" }, 4.42);
      tl.to("#max-maxwrap", { x: 0, duration: 0.45, ease: "power3.out" }, 4.5);
      tl.to(r.head, { rotation: 0, svgOrigin: "150 170", duration: 0.3 }, 4.5);
      tl.to(r.eyes, { x: 0, y: 0, duration: 0.2 }, 4.5);
      arm(r.armL, "L", 8, 4.5, 0.3);
      tl.set("#max-launch", { opacity: 1 }, 4.5);
      tl.fromTo("#max-la0", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18 }, 4.51);
      tl.fromTo("#max-la1", { opacity: 0, scale: 1.3, filter: "blur(10px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.25, ease: "expo.out" }, 5.36);
      hop(r, 5.25, 50);
      arm(r.armL, "L", 160, 5.4, 0.3); arm(r.armR, "R", -160, 5.44, 0.3);
      // alone
      tl.to("#max-launch", { opacity: 0, filter: "blur(8px)", duration: 0.18 }, 6.2);
      tl.set("#max-alone", { opacity: 1 }, 6.3);
      tl.fromTo("#max-al0", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18 }, 6.3);
      tl.fromTo("#max-al1", { opacity: 0, scale: 2.2, rotation: -14 }, { opacity: 1, scale: 1, rotation: -6, duration: 0.22, ease: "power4.in" }, 7.04);
      arm(r.armL, "L", 8, 6.3, 0.4, "power2.inOut"); arm(r.armR, "R", -8, 6.35, 0.4, "power2.inOut");
      tl.to(r.brows, { rotation: -10, svgOrigin: "150 92", y: -4, duration: 0.25 }, 6.4);
      tl.to("#max-maxwrap", { scale: 0.92, transformOrigin: "50% 100%", duration: 0.5, ease: "power2.out" }, 6.4);
      tl.to(r.head, { y: 8, duration: 0.4 }, 6.5);
      // "j'ai besoin de toi": points up at TOI
      tl.to("#max-alone", { opacity: 0, filter: "blur(8px)", duration: 0.18 }, 7.9);
      tl.set("#max-need", { opacity: 1 }, 8.0);
      tl.fromTo("#max-n0", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18 }, 8.07);
      tl.fromTo("#max-n1", { opacity: 0, scale: 1.4, filter: "blur(10px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.25, ease: "expo.out" }, 8.78);
      tl.to("#max-maxwrap", { scale: 1.08, transformOrigin: "50% 100%", duration: 0.35, ease: "back.out(1.6)" }, 8.1);
      tl.to(r.head, { y: 0, duration: 0.25 }, 8.1);
      tl.to(r.brows, { rotation: 6, y: 2, svgOrigin: "150 92", duration: 0.2 }, 8.1);
      arm(r.armR, "R", -150, 8.7, 0.25);
      blink(r, 2.7); blink(r, 5.8); blink(r, 7.6);
      talk(r, [0.05, 0.45, 0.86, 1.35, 1.68, 2.1, 2.26, 2.59, 3.2, 3.44, 4.28, 4.51, 5.36, 5.4, 5.81, 6.3, 6.6, 6.84, 7.24, 8.07, 8.3, 8.78, 8.83]);
      // exit: zoom through "TOI"
      tl.to("#max-cam", { scale: 2.6, transformOrigin: "60% 22%", filter: "blur(16px)", opacity: 0, duration: 0.32, ease: "power3.in" }, 9.079999999999998);

      window.__timelines = window.__timelines || {};
      window.__timelines["max"] = tl;
    })();
  </script>
