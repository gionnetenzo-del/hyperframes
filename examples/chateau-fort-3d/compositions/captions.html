    <div id="cap-113" class="clip cap" data-start="263.83" data-duration="2.26" data-track-index="0"><span id="cap-113-t" class="cap-t">mais ses angles sont vulnérables aux sapes</span></div>
    <div id="cap-114" class="clip cap" data-start="266.07" data-duration="1.53" data-track-index="0"><span id="cap-114-t" class="cap-t">et aux projectiles.</span></div>
    <div id="cap-115" class="clip cap" data-start="268.56" data-duration="2.62" data-track-index="0"><span id="cap-115-t" class="cap-t">La tour ronde, qui se généralise à la fin du</span></div>
    <div id="cap-116" class="clip cap" data-start="271.15" data-duration="2.93" data-track-index="0"><span id="cap-116-t" class="cap-t">douzième siècle, dévie mieux les coups et ne</span></div>
    <div id="cap-117" class="clip cap" data-start="274.07" data-duration="1.88" data-track-index="0"><span id="cap-117-t" class="cap-t">laisse aucun angle mort.</span></div>
    <div id="cap-118" class="clip cap" data-start="276.59" data-duration="2.05" data-track-index="0"><span id="cap-118-t" class="cap-t">Les murs d’un château ne sont pas de simples</span></div>
    <div id="cap-119" class="clip cap" data-start="278.62" data-duration="1.52" data-track-index="0"><span id="cap-119-t" class="cap-t">empilements de pierres.</span></div>
    <div id="cap-120" class="clip cap" data-start="280.28" data-duration="2.74" data-track-index="0"><span id="cap-120-t" class="cap-t">Ils doivent supporter leur propre poids,</span></div>
    <div id="cap-121" class="clip cap" data-start="283.00" data-duration="1.69" data-track-index="0"><span id="cap-121-t" class="cap-t">résister aux intempéries</span></div>
    <div id="cap-122" class="clip cap" data-start="284.68" data-duration="1.58" data-track-index="0"><span id="cap-122-t" class="cap-t">et rendre les attaques beaucoup plus</span></div>
    <div id="cap-123" class="clip cap" data-start="286.24" data-duration="1.19" data-track-index="0"><span id="cap-123-t" class="cap-t">difficiles.</span></div>
    <div id="cap-124" class="clip cap" data-start="287.76" data-duration="2.32" data-track-index="0"><span id="cap-124-t" class="cap-t">En coupe, on découvre deux parements de</span></div>
    <div id="cap-125" class="clip cap" data-start="290.06" data-duration="1.26" data-track-index="0"><span id="cap-125-t" class="cap-t">pierres taillées,</span></div>
    <div id="cap-126" class="clip cap" data-start="291.31" data-duration="2.40" data-track-index="0"><span id="cap-126-t" class="cap-t">et entre eux, un blocage de moellons noyés</span></div>
    <div id="cap-127" class="clip cap" data-start="293.69" data-duration="1.33" data-track-index="0"><span id="cap-127-t" class="cap-t">dans le mortier.</span></div>
    <div id="cap-128" class="clip cap" data-start="297.04" data-duration="1.22" data-track-index="0"><span id="cap-128-t" class="cap-t">Quatrième problème :</span></div>
    <div id="cap-129" class="clip cap" data-start="298.24" data-duration="1.77" data-track-index="0"><span id="cap-129-t" class="cap-t">les murs peuvent s’effondrer.</span></div>
    <div id="cap-130" class="clip cap" data-start="299.99" data-duration="1.24" data-track-index="0"><span id="cap-130-t" class="cap-t">Des pierres mal croisées,</span></div>
    <div id="cap-131" class="clip cap" data-start="301.21" data-duration="2.26" data-track-index="0"><span id="cap-131-t" class="cap-t">un poids mal réparti, des fondations</span></div>
    <div id="cap-132" class="clip cap" data-start="303.45" data-duration="1.12" data-track-index="0"><span id="cap-132-t" class="cap-t">insuffisantes…</span></div>
    <div id="cap-133" class="clip cap" data-start="304.55" data-duration="1.84" data-track-index="0"><span id="cap-133-t" class="cap-t">et les fissures apparaissent.</span></div>
    <div id="cap-134" class="clip cap" data-start="306.44" data-duration="1.87" data-track-index="0"><span id="cap-134-t" class="cap-t">Le mur commence à pencher.</span></div>
    <div id="cap-135" class="clip cap" data-start="310.53" data-duration="1.44" data-track-index="0"><span id="cap-135-t" class="cap-t">La solution :</span></div>
    <div id="cap-136" class="clip cap" data-start="311.95" data-duration="2.39" data-track-index="0"><span id="cap-136-t" class="cap-t">des murs épais, parfois de plus de trois</span></div>
    <div id="cap-137" class="clip cap" data-start="314.32" data-duration="2.63" data-track-index="0"><span id="cap-137-t" class="cap-t">mètres, des joints décalés d’une assise à</span></div>
    <div id="cap-138" class="clip cap" data-start="316.93" data-duration="2.66" data-track-index="0"><span id="cap-138-t" class="cap-t">l’autre, un mortier adapté,</span></div>
    <div id="cap-139" class="clip cap" data-start="319.57" data-duration="1.96" data-track-index="0"><span id="cap-139-t" class="cap-t">et une construction progressive qui laisse à</span></div>
    <div id="cap-140" class="clip cap" data-start="321.50" data-duration="2.38" data-track-index="0"><span id="cap-140-t" class="cap-t">la maçonnerie le temps de durcir.</span></div>
    <div id="cap-141" class="clip cap" data-start="324.66" data-duration="1.10" data-track-index="0"><span id="cap-141-t" class="cap-t">Là où c’est nécessaire,</span></div>
    <div id="cap-142" class="clip cap" data-start="325.74" data-duration="2.32" data-track-index="0"><span id="cap-142-t" class="cap-t">des contreforts viennent épauler le mur.</span></div>
    <div id="cap-143" class="clip cap" data-start="328.04" data-duration="2.28" data-track-index="0"><span id="cap-143-t" class="cap-t">Leur épaisseur, leur structure intérieure et</span></div>
    <div id="cap-144" class="clip cap" data-start="330.31" data-duration="1.83" data-track-index="0"><span id="cap-144-t" class="cap-t">la qualité de leur assemblage</span></div>
    <div id="cap-145" class="clip cap" data-start="332.13" data-duration="1.71" data-track-index="0"><span id="cap-145-t" class="cap-t">sont donc essentielles.</span></div>
    <div id="cap-146" class="clip cap" data-start="336.67" data-duration="1.50" data-track-index="0"><span id="cap-146-t" class="cap-t">Les murs sont debout.</span></div>
    <div id="cap-147" class="clip cap" data-start="338.17" data-duration="1.77" data-track-index="0"><span id="cap-147-t" class="cap-t">Les terrassiers s’attaquent maintenant au</span></div>
    <div id="cap-148" class="clip cap" data-start="339.92" data-duration="3.57" data-track-index="0"><span id="cap-148-t" class="cap-t">fossé, qui encercle peu à peu la forteresse.</span></div>
    <div id="cap-149" class="clip cap" data-start="344.12" data-duration="1.98" data-track-index="0"><span id="cap-149-t" class="cap-t">Ici, une dérivation de la rivière,</span></div>
    <div id="cap-150" class="clip cap" data-start="346.08" data-duration="2.63" data-track-index="0"><span id="cap-150-t" class="cap-t">prise en amont, permet de le remplir d’eau.</span></div>
    <div id="cap-151" class="clip cap" data-start="348.70" data-duration="1.10" data-track-index="0"><span id="cap-151-t" class="cap-t">Mais attention :</span></div>
    <div id="cap-152" class="clip cap" data-start="349.78" data-duration="1.70" data-track-index="0"><span id="cap-152-t" class="cap-t">beaucoup de châteaux se contentaient d’un</span></div>
    <div id="cap-153" class="clip cap" data-start="351.46" data-duration="3.30" data-track-index="0"><span id="cap-153-t" class="cap-t">fossé sec, profond et hérissé de pieux.</span></div>
    <div id="cap-154" class="clip cap" data-start="354.99" data-duration="2.55" data-track-index="0"><span id="cap-154-t" class="cap-t">La douve en eau n’a rien de systématique.</span></div>
    <div id="cap-155" class="clip cap" data-start="359.56" data-duration="1.26" data-track-index="0"><span id="cap-155-t" class="cap-t">Cinquième problème :</span></div>
    <div id="cap-156" class="clip cap" data-start="360.80" data-duration="2.16" data-track-index="0"><span id="cap-156-t" class="cap-t">protéger le château contre les attaques.</span></div>
    <div id="cap-157" class="clip cap" data-start="362.94" data-duration="1.33" data-track-index="0"><span id="cap-157-t" class="cap-t">Une troupe ennemie approche,</span></div>
    <div id="cap-158" class="clip cap" data-start="364.25" data-duration="2.04" data-track-index="0"><span id="cap-158-t" class="cap-t">et cherche à atteindre la porte.</span></div>
    <div id="cap-159" class="clip cap" data-start="368.50" data-duration="1.94" data-track-index="0"><span id="cap-159-t" class="cap-t">Même les murs les plus solides ne suffisent</span></div>
    <div id="cap-160" class="clip cap" data-start="370.42" data-duration="1.16" data-track-index="0"><span id="cap-160-t" class="cap-t">pas toujours.</span></div>
    <div id="cap-161" class="clip cap" data-start="371.64" data-duration="1.96" data-track-index="0"><span id="cap-161-t" class="cap-t">Il faut empêcher les ennemis de s’approcher</span></div>
    <div id="cap-162" class="clip cap" data-start="373.58" data-duration="1.16" data-track-index="0"><span id="cap-162-t" class="cap-t">facilement.</span></div>
    <div id="cap-163" class="clip cap" data-start="374.97" data-duration="2.64" data-track-index="0"><span id="cap-163-t" class="cap-t">Les douves, les tours et les remparts</span></div>
    <div id="cap-164" class="clip cap" data-start="377.60" data-duration="1.76" data-track-index="0"><span id="cap-164-t" class="cap-t">permettent de ralentir les assaillants et</span></div>
    <div id="cap-165" class="clip cap" data-start="379.34" data-duration="2.12" data-track-index="0"><span id="cap-165-t" class="cap-t">d’améliorer la défense du château.</span></div>
    <div id="cap-166" class="clip cap" data-start="381.79" data-duration="1.61" data-track-index="0"><span id="cap-166-t" class="cap-t">Depuis le chemin de ronde,</span></div>
    <div id="cap-167" class="clip cap" data-start="383.38" data-duration="1.62" data-track-index="0"><span id="cap-167-t" class="cap-t">les défenseurs combattent à l’abri des</span></div>
    <div id="cap-168" class="clip cap" data-start="384.98" data-duration="1.69" data-track-index="0"><span id="cap-168-t" class="cap-t">créneaux, et les archères,</span></div>
    <div id="cap-169" class="clip cap" data-start="386.65" data-duration="1.53" data-track-index="0"><span id="cap-169-t" class="cap-t">ces fameuses meurtrières,</span></div>
    <div id="cap-170" class="clip cap" data-start="388.16" data-duration="2.40" data-track-index="0"><span id="cap-170-t" class="cap-t">leur permettent de tirer sans s’exposer.</span></div>
    <div id="cap-171" class="clip cap" data-start="393.39" data-duration="1.95" data-track-index="0"><span id="cap-171-t" class="cap-t">Reste la porte principale.</span></div>
    <div id="cap-172" class="clip cap" data-start="395.34" data-duration="2.03" data-track-index="0"><span id="cap-172-t" class="cap-t">On l’encadre de deux tours puissantes,</span></div>
    <div id="cap-173" class="clip cap" data-start="397.35" data-duration="2.02" data-track-index="0"><span id="cap-173-t" class="cap-t">reliées par un passage voûté.</span></div>
    <div id="cap-174" class="clip cap" data-start="401.00" data-duration="1.09" data-track-index="0"><span id="cap-174-t" class="cap-t">Sixième problème :</span></div>
    <div id="cap-175" class="clip cap" data-start="402.07" data-duration="1.54" data-track-index="0"><span id="cap-175-t" class="cap-t">la porte est le point faible de la</span></div>
    <div id="cap-176" class="clip cap" data-start="403.59" data-duration="1.03" data-track-index="0"><span id="cap-176-t" class="cap-t">forteresse.</span></div>
    <div id="cap-177" class="clip cap" data-start="404.60" data-duration="1.44" data-track-index="0"><span id="cap-177-t" class="cap-t">C’est là que l’ennemi frappera,</span></div>
    <div id="cap-178" class="clip cap" data-start="406.02" data-duration="1.38" data-track-index="0"><span id="cap-178-t" class="cap-t">avec un bélier.</span></div>
    <div id="cap-179" class="clip cap" data-start="409.64" data-duration="1.83" data-track-index="0"><span id="cap-179-t" class="cap-t">La porte est souvent l’un des endroits les</span></div>
    <div id="cap-180" class="clip cap" data-start="411.45" data-duration="1.97" data-track-index="0"><span id="cap-180-t" class="cap-t">plus vulnérables du château.</span></div>
    <div id="cap-181" class="clip cap" data-start="413.47" data-duration="1.65" data-track-index="0"><span id="cap-181-t" class="cap-t">Elle doit permettre aux habitants de</span></div>
    <div id="cap-182" class="clip cap" data-start="415.09" data-duration="1.90" data-track-index="0"><span id="cap-182-t" class="cap-t">circuler tout en empêchant les ennemis de</span></div>
    <div id="cap-183" class="clip cap" data-start="416.98" data-duration="1.57" data-track-index="0"><span id="cap-183-t" class="cap-t">pénétrer facilement.</span></div>
    <div id="cap-184" class="clip cap" data-start="418.88" data-duration="1.89" data-track-index="0"><span id="cap-184-t" class="cap-t">C’est pourquoi les bâtisseurs accordent une</span></div>
    <div id="cap-185" class="clip cap" data-start="420.75" data-duration="2.03" data-track-index="0"><span id="cap-185-t" class="cap-t">attention particulière à cette partie de la</span></div>
    <div id="cap-186" class="clip cap" data-start="422.76" data-duration="1.22" data-track-index="0"><span id="cap-186-t" class="cap-t">forteresse.</span></div>
    <div id="cap-187" class="clip cap" data-start="424.61" data-duration="2.34" data-track-index="0"><span id="cap-187-t" class="cap-t">D’abord, un pont-levis,</span></div>
    <div id="cap-188" class="clip cap" data-start="426.95" data-duration="2.12" data-track-index="0"><span id="cap-188-t" class="cap-t">qui se relève au-dessus du fossé.</span></div>
    <div id="cap-189" class="clip cap" data-start="429.29" data-duration="2.35" data-track-index="0"><span id="cap-189-t" class="cap-t">Derrière lui, une herse de chêne bardée de</span></div>
    <div id="cap-190" class="clip cap" data-start="431.62" data-duration="2.65" data-track-index="0"><span id="cap-190-t" class="cap-t">fer, qui tombe d’un seul coup.</span></div>
    <div id="cap-191" class="clip cap" data-start="434.50" data-duration="1.32" data-track-index="0"><span id="cap-191-t" class="cap-t">Puis de lourds vantaux,</span></div>
    <div id="cap-192" class="clip cap" data-start="435.81" data-duration="1.68" data-track-index="0"><span id="cap-192-t" class="cap-t">bloqués par une poutre.</span></div>
    <div id="cap-193" class="clip cap" data-start="437.62" data-duration="1.59" data-track-index="0"><span id="cap-193-t" class="cap-t">Et au-dessus du passage,</span></div>
    <div id="cap-194" class="clip cap" data-start="439.18" data-duration="1.90" data-track-index="0"><span id="cap-194-t" class="cap-t">des assommoirs permettent de frapper ceux</span></div>
    <div id="cap-195" class="clip cap" data-start="441.06" data-duration="1.79" data-track-index="0"><span id="cap-195-t" class="cap-t">qui parviendraient jusque-là.</span></div>
    <div id="cap-196" class="clip cap" data-start="445.68" data-duration="1.35" data-track-index="0"><span id="cap-196-t" class="cap-t">Un château n’est pas seulement une</span></div>
    <div id="cap-197" class="clip cap" data-start="447.01" data-duration="1.50" data-track-index="0"><span id="cap-197-t" class="cap-t">forteresse militaire.</span></div>
    <div id="cap-198" class="clip cap" data-start="448.49" data-duration="1.75" data-track-index="0"><span id="cap-198-t" class="cap-t">C’est aussi un lieu de vie.</span></div>
    <div id="cap-199" class="clip cap" data-start="450.46" data-duration="1.59" data-track-index="0"><span id="cap-199-t" class="cap-t">Dans la cour, on trouve le puits,</span></div>
    <div id="cap-200" class="clip cap" data-start="452.03" data-duration="1.82" data-track-index="0"><span id="cap-200-t" class="cap-t">les cuisines, les écuries,</span></div>
    <div id="cap-201" class="clip cap" data-start="453.83" data-duration="1.92" data-track-index="0"><span id="cap-201-t" class="cap-t">les greniers et les logis.</span></div>
    <div id="cap-202" class="clip cap" data-start="457.77" data-duration="1.44" data-track-index="0"><span id="cap-202-t" class="cap-t">Septième problème :</span></div>
    <div id="cap-203" class="clip cap" data-start="459.19" data-duration="2.17" data-track-index="0"><span id="cap-203-t" class="cap-t">comment survivre pendant un siège ?</span></div>
    <div id="cap-204" class="clip cap" data-start="461.34" data-duration="2.34" data-track-index="0"><span id="cap-204-t" class="cap-t">L’ennemi encercle la place et coupe tous les</span></div>
    <div id="cap-205" class="clip cap" data-start="463.66" data-duration="1.22" data-track-index="0"><span id="cap-205-t" class="cap-t">approvisionnements.</span></div>
    <div id="cap-206" class="clip cap" data-start="464.94" data-duration="2.54" data-track-index="0"><span id="cap-206-t" class="cap-t">Jour après jour, les réserves diminuent.</span></div>
    <div id="cap-207" class="clip cap" data-start="469.70" data-duration="1.80" data-track-index="0"><span id="cap-207-t" class="cap-t">En cas de siège, les habitants peuvent</span></div>
    <div id="cap-208" class="clip cap" data-start="471.47" data-duration="2.08" data-track-index="0"><span id="cap-208-t" class="cap-t">rester enfermés pendant longtemps.</span></div>
    <div id="cap-209" class="clip cap" data-start="473.79" data-duration="1.33" data-track-index="0"><span id="cap-209-t" class="cap-t">Il faut donc prévoir de l’eau,</span></div>
    <div id="cap-210" class="clip cap" data-start="475.10" data-duration="2.65" data-track-index="0"><span id="cap-210-t" class="cap-t">de la nourriture et des espaces de stockage.</span></div>
    <div id="cap-211" class="clip cap" data-start="477.98" data-duration="1.32" data-track-index="0"><span id="cap-211-t" class="cap-t">Quand la géologie le permet,</span></div>
    <div id="cap-212" class="clip cap" data-start="479.28" data-duration="2.23" data-track-index="0"><span id="cap-212-t" class="cap-t">on creuse un puits jusqu’à la nappe d’eau,</span></div>
    <div id="cap-213" class="clip cap" data-start="481.48" data-duration="1.74" data-track-index="0"><span id="cap-213-t" class="cap-t">parfois à plusieurs dizaines de mètres de</span></div>
    <div id="cap-214" class="clip cap" data-start="483.20" data-duration="1.15" data-track-index="0"><span id="cap-214-t" class="cap-t">profondeur.</span></div>
    <div id="cap-215" class="clip cap" data-start="484.49" data-duration="2.14" data-track-index="0"><span id="cap-215-t" class="cap-t">Sans eau potable, aucune garnison ne peut</span></div>
    <div id="cap-216" class="clip cap" data-start="486.61" data-duration="0.89" data-track-index="0"><span id="cap-216-t" class="cap-t">tenir.</span></div>
    <div id="cap-217" class="clip cap" data-start="487.50" data-duration="1.63" data-track-index="0"><span id="cap-217-t" class="cap-t">On stocke les céréales au sec,</span></div>
    <div id="cap-218" class="clip cap" data-start="489.11" data-duration="2.36" data-track-index="0"><span id="cap-218-t" class="cap-t">on sale la viande, on fume le poisson,</span></div>
    <div id="cap-219" class="clip cap" data-start="491.45" data-duration="2.20" data-track-index="0"><span id="cap-219-t" class="cap-t">et l’on tient le compte de chaque sac.</span></div>
    <div id="cap-220" class="clip cap" data-start="496.49" data-duration="1.61" data-track-index="0"><span id="cap-220-t" class="cap-t">Mais un château n’est jamais vraiment</span></div>
    <div id="cap-221" class="clip cap" data-start="498.08" data-duration="0.87" data-track-index="0"><span id="cap-221-t" class="cap-t">terminé.</span></div>
    <div id="cap-222" class="clip cap" data-start="498.92" data-duration="1.80" data-track-index="0"><span id="cap-222-t" class="cap-t">De nouveaux problèmes apparaissent sans</span></div>
    <div id="cap-223" class="clip cap" data-start="500.70" data-duration="1.07" data-track-index="0"><span id="cap-223-t" class="cap-t">cesse.</span></div>
    <div id="cap-224" class="clip cap" data-start="502.60" data-duration="2.42" data-track-index="0"><span id="cap-224-t" class="cap-t">Une forte pluie, et la toiture fuit :</span></div>
    <div id="cap-225" class="clip cap" data-start="505.07" data-duration="1.70" data-track-index="0"><span id="cap-225-t" class="cap-t">les couvreurs remplacent les ardoises</span></div>
    <div id="cap-226" class="clip cap" data-start="506.75" data-duration="0.99" data-track-index="0"><span id="cap-226-t" class="cap-t">brisées.</span></div>
    <div id="cap-227" class="clip cap" data-start="508.58" data-duration="1.97" data-track-index="0"><span id="cap-227-t" class="cap-t">L’humidité attaque la charpente :</span></div>
    <div id="cap-228" class="clip cap" data-start="510.53" data-duration="1.57" data-track-index="0"><span id="cap-228-t" class="cap-t">les charpentiers changent les pièces</span></div>
    <div id="cap-229" class="clip cap" data-start="512.07" data-duration="1.23" data-track-index="0"><span id="cap-229-t" class="cap-t">fragilisées.</span></div>
    <div id="cap-230" class="clip cap" data-start="514.14" data-duration="1.91" data-track-index="0"><span id="cap-230-t" class="cap-t">Des fissures zèbrent un mur :</span></div>
    <div id="cap-231" class="clip cap" data-start="516.03" data-duration="2.16" data-track-index="0"><span id="cap-231-t" class="cap-t">les maçons les rejointoient et ajoutent un</span></div>
    <div id="cap-232" class="clip cap" data-start="518.17" data-duration="1.30" data-track-index="0"><span id="cap-232-t" class="cap-t">contrefort.</span></div>
    <div id="cap-233" class="clip cap" data-start="520.30" data-duration="2.45" data-track-index="0"><span id="cap-233-t" class="cap-t">L’eau de pluie stagne dans la cour :</span></div>
    <div id="cap-234" class="clip cap" data-start="522.73" data-duration="2.33" data-track-index="0"><span id="cap-234-t" class="cap-t">on creuse des rigoles, et des gargouilles</span></div>
    <div id="cap-235" class="clip cap" data-start="525.04" data-duration="2.41" data-track-index="0"><span id="cap-235-t" class="cap-t">l’évacuent loin des murs.</span></div>
    <div id="cap-236" class="clip cap" data-start="528.27" data-duration="1.91" data-track-index="0"><span id="cap-236-t" class="cap-t">Les réserves sont trop justes :</span></div>
    <div id="cap-237" class="clip cap" data-start="530.16" data-duration="1.76" data-track-index="0"><span id="cap-237-t" class="cap-t">on agrandit les celliers.</span></div>
    <div id="cap-238" class="clip cap" data-start="531.92" data-duration="1.80" data-track-index="0"><span id="cap-238-t" class="cap-t">Et lorsqu’un accès paraît trop facile,</span></div>
    <div id="cap-239" class="clip cap" data-start="533.69" data-duration="2.13" data-track-index="0"><span id="cap-239-t" class="cap-t">on le mure, ou on le protège par une</span></div>
    <div id="cap-240" class="clip cap" data-start="535.80" data-duration="1.33" data-track-index="0"><span id="cap-240-t" class="cap-t">nouvelle tour.</span></div>
    <div id="cap-241" class="clip cap" data-start="537.96" data-duration="2.49" data-track-index="0"><span id="cap-241-t" class="cap-t">Entretenir et réparer sans relâche :</span></div>
    <div id="cap-242" class="clip cap" data-start="540.43" data-duration="2.16" data-track-index="0"><span id="cap-242-t" class="cap-t">c’est le secret de la longévité.</span></div>
    <div id="cap-243" class="clip cap" data-start="542.82" data-duration="1.97" data-track-index="0"><span id="cap-243-t" class="cap-t">Grâce à ce travail, certaines forteresses</span></div>
    <div id="cap-244" class="clip cap" data-start="544.77" data-duration="3.07" data-track-index="0"><span id="cap-244-t" class="cap-t">sont encore debout, huit siècles plus tard.</span></div>
    <div id="cap-245" class="clip cap" data-start="550.27" data-duration="1.45" data-track-index="0"><span id="cap-245-t" class="cap-t">Petite pause !</span></div>
    <div id="cap-246" class="clip cap" data-start="551.72" data-duration="1.71" data-track-index="0"><span id="cap-246-t" class="cap-t">Si vous aimez découvrir les secrets de</span></div>
    <div id="cap-247" class="clip cap" data-start="553.41" data-duration="2.84" data-track-index="0"><span id="cap-247-t" class="cap-t">l’histoire grâce à ces constructions en 3D,</span></div>
    <div id="cap-248" class="clip cap" data-start="556.30" data-duration="2.13" data-track-index="0"><span id="cap-248-t" class="cap-t">pensez à mettre un petit pouce bleu,</span></div>
    <div id="cap-249" class="clip cap" data-start="558.42" data-duration="2.63" data-track-index="0"><span id="cap-249-t" class="cap-t">à vous abonner à la chaîne et à activer la</span></div>
    <div id="cap-250" class="clip cap" data-start="561.03" data-duration="1.63" data-track-index="0"><span id="cap-250-t" class="cap-t">cloche pour ne pas manquer les prochaines</span></div>
    <div id="cap-251" class="clip cap" data-start="562.64" data-duration="0.99" data-track-index="0"><span id="cap-251-t" class="cap-t">vidéos.</span></div>
    <div id="cap-252" class="clip cap" data-start="564.05" data-duration="2.24" data-track-index="0"><span id="cap-252-t" class="cap-t">Et surtout, dites-moi dans les commentaires</span></div>
    <div id="cap-253" class="clip cap" data-start="566.27" data-duration="1.88" data-track-index="0"><span id="cap-253-t" class="cap-t">quelle construction historique vous aimeriez</span></div>
    <div id="cap-254" class="clip cap" data-start="568.12" data-duration="1.23" data-track-index="0"><span id="cap-254-t" class="cap-t">voir ensuite :</span></div>
    <div id="cap-255" class="clip cap" data-start="569.36" data-duration="2.20" data-track-index="0"><span id="cap-255-t" class="cap-t">une pyramide, une cathédrale,</span></div>
    <div id="cap-256" class="clip cap" data-start="571.54" data-duration="2.67" data-track-index="0"><span id="cap-256-t" class="cap-t">un aqueduc romain ou une cité médiévale ?</span></div>
    <div id="cap-257" class="clip cap" data-start="574.44" data-duration="1.54" data-track-index="0"><span id="cap-257-t" class="cap-t">Je lirai vos idées !</span></div>
    <div id="cap-258" class="clip cap" data-start="581.80" data-duration="1.97" data-track-index="0"><span id="cap-258-t" class="cap-t">Construire un château fort au Moyen Âge</span></div>
    <div id="cap-259" class="clip cap" data-start="583.75" data-duration="2.05" data-track-index="0"><span id="cap-259-t" class="cap-t">était un travail gigantesque.</span></div>
    <div id="cap-260" class="clip cap" data-start="585.93" data-duration="1.90" data-track-index="0"><span id="cap-260-t" class="cap-t">Il fallait choisir le bon terrain,</span></div>
    <div id="cap-261" class="clip cap" data-start="587.81" data-duration="1.97" data-track-index="0"><span id="cap-261-t" class="cap-t">préparer des fondations solides,</span></div>
    <div id="cap-262" class="clip cap" data-start="589.76" data-duration="2.26" data-track-index="0"><span id="cap-262-t" class="cap-t">transporter des milliers de matériaux,</span></div>
    <div id="cap-263" class="clip cap" data-start="592.00" data-duration="2.20" data-track-index="0"><span id="cap-263-t" class="cap-t">construire des murs imposants et anticiper</span></div>
    <div id="cap-264" class="clip cap" data-start="594.18" data-duration="1.63" data-track-index="0"><span id="cap-264-t" class="cap-t">les dangers d’un siège.</span></div>
    <div id="cap-265" class="clip cap" data-start="596.63" data-duration="2.59" data-track-index="0"><span id="cap-265-t" class="cap-t">Chaque problème nécessitait une solution,</span></div>
    <div id="cap-266" class="clip cap" data-start="599.20" data-duration="2.10" data-track-index="0"><span id="cap-266-t" class="cap-t">et chaque étape demandait le savoir-faire de</span></div>
    <div id="cap-267" class="clip cap" data-start="601.28" data-duration="1.48" data-track-index="0"><span id="cap-267-t" class="cap-t">nombreux artisans.</span></div>
    <div id="cap-268" class="clip cap" data-start="603.09" data-duration="2.24" data-track-index="0"><span id="cap-268-t" class="cap-t">Ces forteresses sont aujourd’hui les témoins</span></div>
    <div id="cap-269" class="clip cap" data-start="605.31" data-duration="1.80" data-track-index="0"><span id="cap-269-t" class="cap-t">impressionnants de l’ingéniosité des</span></div>
    <div id="cap-270" class="clip cap" data-start="607.08" data-duration="1.66" data-track-index="0"><span id="cap-270-t" class="cap-t">bâtisseurs médiévaux.</span></div>
    <div id="cap-271" class="clip cap" data-start="612.36" data-duration="2.32" data-track-index="0"><span id="cap-271-t" class="cap-t">Et vous, quel monument aimeriez-vous voir</span></div>
    <div id="cap-272" class="clip cap" data-start="614.66" data-duration="2.19" data-track-index="0"><span id="cap-272-t" class="cap-t">construire dans notre prochaine vidéo ?</span></div>
    <div id="cap-273" class="clip cap" data-start="617.18" data-duration="2.40" data-track-index="0"><span id="cap-273-t" class="cap-t">Merci d’avoir regardé, et à très bientôt</span></div>
